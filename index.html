<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
      <div class="top">
          <div class="display">
          </div>
          <div class="result">
              <span>0</span>
          </div>
      </div>
      <div class="keys">
        <button style="background-color: rgb(255, 174, 0)">+</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>

        <button style="background-color: rgb(255, 174, 0)">-</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        
        <button style="background-color: rgb(255, 174, 0);">*</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        
        <button style="background-color: rgb(255, 174, 0);">/</button>
        <button>0</button>
        <button style="background-color: rgb(255, 174, 0);">.</button>
        <button style="background-color: red;">=</button>
        
        <button style="background-color: rgb(255, 174, 0);">C</button>
        <button style="background-color: rgb(255, 174, 0);">Del</button>
      </div>
    </div>
 <script src="script.js"></script>
</body>
</html>
